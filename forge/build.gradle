plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:$minecraft_version-$forge_version"
    modApi "dev.architectury:architectury-forge:$architectury_version"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
    modImplementation("software.bernie.geckolib:geckolib-forge-1.18:$gecko_lib_version")
    modImplementation("com.github.glitchfiend:TerraBlender-forge:$minecraft_version-$terra_blender_version")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.4.1"))
   // modRuntimeOnly("curse.maven:architectury-api-419699:5137931") //1.18.2

    //(Optional) FD & Addons
    modImplementation("maven.modrinth:farmers-delight:$farmers_delight_version_forge")
    modImplementation("curse.maven:argentinasdelight-831127:4818251") //1.18.2 3.0 beta

    modImplementation("curse.maven:alexs-delight-556448:3984913") //1.18.2 1.3.3
    modImplementation "maven.modrinth:alexs-mobs:1.18.6" //For alex's delight
    modImplementation("curse.maven:citadel-331936:3783096") //For alex's delight/alex's mobs

    modImplementation("curse.maven:brewin-and-chewin-637808:3851036") //1.18.2 1.0.0
    modImplementation("maven.modrinth:butchers-delight:1.18.22.1.0") //1.18.2 2.1.0
    modImplementation("maven.modrinth:butchers-delight-foods:1.18.21.0.3") //1.18.2 2.1.0
    modImplementation("maven.modrinth:biomesyougo:4Bo5c6or") //1.5.1
    modImplementation("curse.maven:casualness-delight-909519:5194377") //1.18.2 0.4
    modImplementation("maven.modrinth:coffee-delight:GUalG4PE") //1.18.2 1.4

    modImplementation("maven.modrinth:corn-delight:1.0.6-1.18.2")
    modImplementation("maven.modrinth:mmlib:1.4.7-1.18.2") //For corn delight

    modImplementation("maven.modrinth:crabbers-delight:raWodeSb")
    modImplementation("curse.maven:cultural-delights-574622:4000179") //1.18.2 0.14 modrinth 1.19+

    modImplementation("curse.maven:delightful-637529:4275637") //1.18.2 3.2.1 modrinth 1.19+
    modImplementation("maven.modrinth:ars-nouveau:2.9.0") //for delightful
    modImplementation("curse.maven:curios-309927:4985315") //For ars nouveau
    modImplementation("curse.maven:patchouli-306770:3846086") //For ars nouveau

    modImplementation("maven.modrinth:ends-delight:1.18.2-1.2.1")
    modImplementation("maven.modrinth:enders-delight:1.18.2-1.2.1")
    modImplementation("curse.maven:farmers-respite-551453:3859156") //1.18.2 1.3.0
    modImplementation("maven.modrinth:festive-delight:1.1.0")
    modImplementation("curse.maven:honey-expansion-add-on-for-farmers-delight-541951:3751480") //1.18.2 1.1.1
    modImplementation("curse.maven:italians-delight-669167:4435561") //1.18.2 1.5
    modImplementation("curse.maven:large-meals-an-add-on-for-farmers-delight-625110:4032025") //1.18.2 1.2.0
    modImplementation("curse.maven:miners-delight-plus-689630:4738271") //1.18.2 1.1.2
    modImplementation("curse.maven:nethers-delight-496394:3756127") //1.18.2 2.2.0
    modImplementation("maven.modrinth:oceans-delight:1.0.0-1.18.2")
    modImplementation("maven.modrinth:pineapple-delight:1.1.2-1.18.2-forge")
    modImplementation("maven.modrinth:seed-delight:1.0.1")


    modImplementation("curse.maven:better-animals-plus-303557:4318511") //1.18.2-11.0.10
    modImplementation("curse.maven:exotic-birds-242830:3962438") //1.18.2-1.8.0
    modImplementation("curse.maven:naturalist-627986:3930806") //1.18.2-1.1.1
    modImplementation("curse.maven:fossil-223908:8217370") //1.18.2-9.3.4.0
    modImplementation("com.github.darkpred.morehitboxes:morehitboxes-forge-$minecraft_version:1.9.2")
}

loom {
    runs {
        data {
            //regen run config if changed
            data()
            programArgs "--all", "--mod", "$mod_id"
            programArgs "--output",  project(":forge").file("src/generated/resources/").absolutePath
            programArgs "--existing", project(":forge").file("src/main/resources/").absolutePath
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    archiveAppendix = "forge-$minecraft_version"
}
